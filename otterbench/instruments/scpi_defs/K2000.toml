# Keithley 2000-series bench DMMs in SCPI mode (not 488.1 / DDC emulation).
id = "K2000"
name = "Keithley 2000 / 2001 / 2002 / 2010 / 2100 (SCPI)"
maker = "Keithley"
type = "meter"
idn = ["MODEL 2000", "MODEL 2001", "MODEL 2002", "MODEL 2010", "MODEL 2100"]
# READ? needs continuous initiation off (otherwise -213 "Init ignored")
init = ["*CLS", ":INIT:CONT OFF", ":FORM:ELEM READ"]
error_query = ":SYST:ERR?"
notes = "Continuous triggering is switched off so READ? can take each reading; the front panel shows the last one. Press LOCAL to give the front panel back."

[[reading]]
name = "value"
label = "Reading"
query = ":READ?"
unit = "V"
unit_from = "function"
sim = "{'DC V': 5.0, 'AC V': 0.12, 'DC I': 0.01, 'AC I': 0.001, '2W ohm': 1000, '4W ohm': 1000, 'Frequency': 1000}.get(function, 0) * (1 + noise(1e-5))"

[[setting]]
name = "function"
label = "Function"
kind = "choice"
query = ":SENS:FUNC?"
options = [
  { label = "DC V", set = ":SENS:FUNC 'VOLT:DC'", reply = 'VOLT:DC', unit = "V" },
  { label = "AC V", set = ":SENS:FUNC 'VOLT:AC'", reply = 'VOLT:AC', unit = "V" },
  { label = "DC I", set = ":SENS:FUNC 'CURR:DC'", reply = 'CURR:DC', unit = "A" },
  { label = "AC I", set = ":SENS:FUNC 'CURR:AC'", reply = 'CURR:AC', unit = "A" },
  { label = "2W ohm", set = ":SENS:FUNC 'RES'", reply = '^"?RES', unit = "Ω", sim = '"RES"' },
  { label = "4W ohm", set = ":SENS:FUNC 'FRES'", reply = 'FRES', unit = "Ω" },
  { label = "Frequency", set = ":SENS:FUNC 'FREQ'", reply = 'FREQ', unit = "Hz" },
]
sim = "DC V"

[[setting]]
name = "nplc"
label = "Integration (DC V)"
kind = "number"
unit = "PLC"
set = ":SENS:VOLT:DC:NPLC {value}"
query = ":SENS:VOLT:DC:NPLC?"
values = [0.01, 0.1, 1, 10]
sim = "1"
