# East Tester ET44xx / ET45xx LCR meters (also sold as RuoShui 4090 / 4091).
id = "ET44"
name = "East Tester ET4401 / ET4402 / ET4410 / ET45xx LCR meter (USB serial)"
maker = "East Tester"
type = "meter"
protocol = "scpi-ack"
idn = ["ET4401", "ET4402", "ET4410", "ET4501", "ET4502", "ET4510", "4090A", "4090B", "4090C", "4091A", "4091B", "4091C"]
error_query = ""
off = []
poll_ms = 300
notes = "The primary parameter has no unit while the function is Auto: choose C, L or R for recorded data. Frequencies and levels it does not have are rejected by the meter."

[[reading]]
name = "primary"
label = "Primary"
query = "FETCh?"
unit_from = "function"
field = 0
sim = "1.0012e-7 + noise(2e-11)"

[[reading]]
name = "secondary"
label = "Secondary"
query = "FETCh?"
unit_from = "second"
field = 1
sim = "0.0123 + noise(1e-5)"

[[setting]]
name = "function"
label = "Primary"
kind = "choice"
query = "FUNC:IMP:A?"
options = [
  {label = "Auto", set = "FUNC:IMP:A AUTO", reply = "^AUTO$"},
  {label = "C", set = "FUNC:IMP:A C", reply = "^C$", unit = "F"},
  {label = "L", set = "FUNC:IMP:A L", reply = "^L$", unit = "H"},
  {label = "R", set = "FUNC:IMP:A R", reply = "^R$", unit = "Ω"},
  {label = "Z", set = "FUNC:IMP:A Z", reply = "^Z$", unit = "Ω"},
  {label = "DCR", set = "FUNC:IMP:A DCR", reply = "^DCR$", unit = "Ω"},
  {label = "ECAP", set = "FUNC:IMP:A ECAP", reply = "^ECAP$", unit = "F"},
]
sim = "C"

[[setting]]
name = "second"
label = "Secondary"
kind = "choice"
query = "FUNC:IMP:B?"
options = [
  {label = "D", set = "FUNC:IMP:B D", reply = "^D$"},
  {label = "Q", set = "FUNC:IMP:B Q", reply = "^Q$"},
  {label = "ESR", set = "FUNC:IMP:B ESR", reply = "^ESR$", unit = "Ω"},
  {label = "X", set = "FUNC:IMP:B X", reply = "^X$", unit = "Ω"},
  {label = "Phase", set = "FUNC:IMP:B THR", reply = "^THR$", unit = "°"},
]

[[setting]]
name = "model"
label = "Equivalent"
kind = "choice"
query = "FUNC:IMP:EQU?"
options = [
  {label = "Series", set = "FUNC:IMP:EQU SER", reply = "^SER", sim = "SERIAL"},
  {label = "Parallel", set = "FUNC:IMP:EQU PAR", reply = "^PA", sim = "PALLEL"},
]

[[setting]]
name = "frequency"
label = "Frequency"
kind = "number"
unit = "Hz"
min = 10
max = 100000
set = "FREQ {value}"
query = "FREQ?"
sim = "1000"

[[setting]]
name = "level"
label = "Test level"
kind = "number"
unit = "mV"
min = 10
max = 2000
set = "VOLT {value}"
query = "VOLT?"
sim = "1000"

[[setting]]
name = "bias"
label = "DC bias"
kind = "number"
unit = "mV"
min = 0
max = 1500
set = "BIAS:VOLT {value}"
query = "BIAS:VOLT?"

[[setting]]
name = "speed"
label = "Speed"
kind = "choice"
query = "APER?"
options = [
  {label = "Slow", set = "APER SLOW", reply = "^SLO", sim = "SLOW"},
  {label = "Medium", set = "APER MEDium", reply = "^MED", sim = "MEDIUM"},
  {label = "Fast", set = "APER FAST", reply = "^FAS", sim = "FAST"},
]
