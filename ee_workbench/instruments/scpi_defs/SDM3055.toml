# Siglent SDM3000X bench DMMs (34401A-style SCPI).
id = "SDM3055"
name = "Siglent SDM3045X / SDM3055 / SDM3065X"
maker = "Siglent"
type = "meter"
idn = ["SDM3045", "SDM3055", "SDM3065"]
init = ["*CLS"]
error_query = "SYST:ERR?"
notes = "Over LAN, use the VXI-11 form (TCPIP::<ip>::INSTR) or port 5025 raw sockets."

[[reading]]
name = "value"
label = "Reading"
query = "READ?"
unit = "V"
unit_from = "function"
sim = "{'DC V': 3.3, 'AC V': 0.12, 'DC I': 0.015, 'AC I': 0.001, '2W ohm': 1000, '4W ohm': 1000, 'Frequency': 1000, 'Capacitance': 1e-7}.get(function, 0) * (1 + noise(3e-5))"

[[setting]]
name = "function"
label = "Function"
kind = "choice"
query = "CONF?"
options = [
  { label = "DC V", set = "CONF:VOLT:DC AUTO", reply = '^"?VOLT[ ,"]', unit = "V", sim = '"VOLT +1.000000E+01,+3.000000E-06"' },
  { label = "AC V", set = "CONF:VOLT:AC AUTO", reply = '^"?VOLT:AC', unit = "V", sim = '"VOLT:AC +1.000000E+00"' },
  { label = "DC I", set = "CONF:CURR:DC AUTO", reply = '^"?CURR[ ,"]', unit = "A", sim = '"CURR +1.000000E-01"' },
  { label = "AC I", set = "CONF:CURR:AC AUTO", reply = '^"?CURR:AC', unit = "A", sim = '"CURR:AC +1.000000E-01"' },
  { label = "2W ohm", set = "CONF:RES AUTO", reply = '^"?RES', unit = "Ω", sim = '"RES +1.000000E+03"' },
  { label = "4W ohm", set = "CONF:FRES AUTO", reply = '^"?FRES', unit = "Ω", sim = '"FRES +1.000000E+03"' },
  { label = "Frequency", set = "CONF:FREQ", reply = '^"?FREQ', unit = "Hz", sim = '"FREQ"' },
  { label = "Capacitance", set = "CONF:CAP AUTO", reply = '^"?CAP', unit = "F", sim = '"CAP +1.000000E-06"' },
]
sim = "DC V"
