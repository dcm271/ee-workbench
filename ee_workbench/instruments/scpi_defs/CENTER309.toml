# Four-channel thermocouple loggers with the Center 3xx protocol.
id = "CENTER309"
name = "Center 309 / Voltcraft K204 thermometer (4 thermocouples)"
maker = "Center"
type = "meter"
protocol = "center"
idn = ["Center,309"]
error_query = ""
off = []
poll_ms = 1000
notes = "Readings are always in °C. An unplugged input shows OVLD."

[[reading]]
name = "t1"
label = "T1"
query = "T1?"
unit = "°C"
plot = "Temperature"

[[reading]]
name = "t2"
label = "T2"
query = "T2?"
unit = "°C"
plot = "Temperature"

[[reading]]
name = "t3"
label = "T3"
query = "T3?"
unit = "°C"
plot = "Temperature"

[[reading]]
name = "t4"
label = "T4"
query = "T4?"
unit = "°C"
plot = "Temperature"
