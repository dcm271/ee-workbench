# Korad-made supplies (many brands): text without line ends (instruments/adapters.py).
id = "KA3005P"
name = "Korad KA3005P / KD3005P, Tenma 72-2540 / 72-2535 / 72-2710, RND 320, Velleman PS3005D (30 V)"
maker = "Korad"
type = "supply"
protocol = "korad"
idn = ["KA3005P", "KD3005P", "72-2540", "72-2535", "72-2705", "72-2710", "PS3005", "S-LS-31"]
error_query = ""
off = ["OUT OFF"]
poll_ms = 400
notes = "Slow: about 80 ms per command. The OVP and OCP switches arm the protections at the set voltage and current."

[[reading]]
name = "voltage"
label = "Voltage"
query = "VOUT?"
unit = "V"

[[reading]]
name = "current"
label = "Current"
query = "IOUT?"
unit = "A"

[[reading]]
name = "cv"
label = "Constant voltage (1 = yes)"
query = "CV?"
plot = "-"

[[setting]]
name = "vset"
label = "Voltage"
kind = "number"
unit = "V"
min = 0
max = 31
set = "VSET {value}"
query = "VSET?"

[[setting]]
name = "iset"
label = "Current limit"
kind = "number"
unit = "A"
min = 0
max = 5.1
set = "ISET {value}"
query = "ISET?"

[[setting]]
name = "ovp_on"
label = "OVP"
kind = "bool"
set = "OVP {on_off}"
query = "OVP?"

[[setting]]
name = "ocp_on"
label = "OCP"
kind = "bool"
set = "OCP {on_off}"
query = "OCP?"

[[setting]]
name = "out"
label = "Output"
kind = "bool"
set = "OUT {on_off}"
query = "OUT?"
output = true
