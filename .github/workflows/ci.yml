name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 fonts-dejavu-core
      - run: pip install -e .[dev]
      - name: Instrument definitions
        run: python -m otterbench.check_instruments
      - name: Tests (simulators and tapes)
        run: python -m pytest tests -q

  # Ubuntu's own (older) Qt and numpy, which the .deb uses
  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-deb.sh dist
      - name: GPIB packages
        run: |
          LIB_IMAGE=debian:12 scripts/build-gpib-deb.sh dist
          sudo apt-get update
          sudo apt-get install -y "linux-headers-$(uname -r)" ./dist/otterbench-gpib-dkms_*.deb ./dist/otterbench-libgpib_*.deb
          modinfo ni_usb_gpib
      - name: Install it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ./dist/*.deb python3-pytest \
            fonts-dejavu-core
          otterbench --version
          otterbench-check-instruments
      - name: Tests
        run: /usr/bin/python3 -m pytest tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: otterbench-deb
          path: dist/*.deb

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: The wheel has the definitions and pictures
        run: |
          pip install dist/*.whl
          cd /tmp
          otterbench-check-instruments | grep -q 'ok .*SCPI:DP832'
          python -c "import otterbench.about as a; assert (a.BRANDING / 'logo.svg').exists()"
      - uses: actions/upload-artifact@v4
        with:
          name: otterbench
          path: dist/
