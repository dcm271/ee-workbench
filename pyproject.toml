[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "otterbench"
description = "Control, log and automate a bench of test instruments"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Daniel McCall" }]
requires-python = ">=3.11"
dynamic = ["version"]
# On Debian, Ubuntu and the Pi scripts/setup-*.sh use the distribution's PyQt6
# and numpy instead (requirements.txt); this is for `pip install`.
dependencies = [
    "PyQt6>=6.4",
    "numpy>=1.24",
    "pyqtgraph>=0.13",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "pyserial>=3.5",
    "pyusb>=1.2",
]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
pdf = ["weasyprint"]
saleae = ["logic2-automation>=1.0"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/dcm271/otterbench"

[project.scripts]
otterbench = "otterbench.__main__:run"
otterbench-check-instruments = "otterbench.check_instruments:main"
otterbench-replay = "otterbench.replay:main"
otterbench-compare = "otterbench.compare:main"

[tool.setuptools.dynamic]
version = { attr = "otterbench.about.VERSION" }

[tool.setuptools.packages.find]
include = ["otterbench", "otterbench.*"]

[tool.setuptools.package-data]
otterbench = ["gui/branding/*", "gui/icons/*", "instruments/scpi_defs/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
